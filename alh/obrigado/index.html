<style>
  :root {
    --ink: #14140f;
    --surface: #23302c;
    --teal: #2f9e8f;
    --teal-text: #39d888;
    --amber: #db7a33;
    --gray: #b3b8ac;
    --mist: #eceadf;
    --red: #b3261e;
    --red-dark: #8c1d17;
    --lime: #39d888;
    --lime-dark: #22b56c;
    --lime-soft: rgba(57, 216, 136, 0.85);
    --font-sans: "Maven Pro", system-ui, -apple-system, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, monospace;
  }

  * { box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    margin: 0;
    min-height: 100vh;
    color: var(--mist);
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
    position: relative;
    background-color: #060805;
    background-image:
      radial-gradient(circle at 18% 12%, rgba(57, 216, 136,0.16) 0%, transparent 42%),
      radial-gradient(circle at 84% 78%, rgba(57, 216, 136,0.14) 0%, transparent 45%),
      radial-gradient(circle at 50% 100%, rgba(57, 216, 136,0.08) 0%, transparent 55%),
      linear-gradient(180deg, #0a0d08 0%, #060805 55%, #020302 100%);
    background-size: auto, auto, auto, auto;
    background-position: 0 0, 0 0, 0 0, 0 0;
    background-repeat: no-repeat, no-repeat, no-repeat, no-repeat;
    background-attachment: fixed, fixed, fixed, fixed;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background:
      radial-gradient(ellipse 60% 40% at 50% 0%, rgba(57, 216, 136,0.10) 0%, transparent 70%),
      radial-gradient(ellipse 50% 35% at 100% 100%, rgba(57, 216, 136,0.08) 0%, transparent 70%);
  }

  main, footer, header { position: relative; z-index: 1; }

  .container {
    max-width: 720px;
    margin: 0 auto;
    padding: 0 20px;
  }

  /* ===== Selo de confirmação ===== */
  main {
    padding: 120px 0;
    text-align: center;
  }

  .check {
    width: 76px;
    height: 76px;
    margin: 0 auto 24px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 25%, var(--lime) 0%, var(--lime-dark) 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 0 8px rgba(57,216,136,0.12), 0 12px 30px rgba(57,216,136,0.25);
  }

  .check svg {
    width: 38px;
    height: 38px;
  }

  .eyebrow {
    font-family: var(--font-mono);
    font-weight: 600;
    font-size: 0.8125rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--teal-text);
    margin: 0 0 14px;
  }

  h1 {
    font-family: var(--font-sans);
    font-weight: 800;
    font-size: clamp(1.9375rem, 1.5375rem + 1.9vw, 2.9375rem);
    line-height: 1.15;
    margin: 0 0 16px;
    color: #fff;
  }

  h1 .accent { color: var(--lime); }

  .sub {
    font-size: clamp(1.0625rem, 1rem + 0.3vw, 1.1875rem);
    line-height: 1.55;
    color: var(--gray);
    max-width: 52ch;
    margin: 0 auto 36px;
  }

  /* ===== CTA ===== */
  .cta {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    max-width: 420px;
    padding: 20px 28px;
    border-radius: 12px;
    background: linear-gradient(180deg, var(--lime) 0%, var(--lime-dark) 100%);
    color: var(--ink);
    font-family: var(--font-sans);
    font-weight: 800;
    font-size: clamp(1.0625rem, 1rem + 0.3vw, 1.25rem);
    text-decoration: none;
    box-shadow: 0 12px 30px rgba(57,216,136,0.28), 0 0 0 1px rgba(57,216,136,0.35);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  .cta:hover {
    transform: translateY(-2px);
    box-shadow: 0 16px 36px rgba(57,216,136,0.35), 0 0 0 1px rgba(57,216,136,0.45);
  }

  .cta svg {
    width: 20px;
    height: 20px;
    flex-shrink: 0;
  }

  .cta-note {
    font-family: var(--font-mono);
    font-size: 0.8125rem;
    color: var(--gray);
    margin: 16px 0 0;
    letter-spacing: 0.01em;
  }

  /* ===== Rodapé ===== */
  footer {
    border-top: 1px solid rgba(255,255,255,0.08);
    padding: 32px 0 40px;
    text-align: center;
  }

  footer .logo {
    height: 22px;
    width: auto;
    margin-bottom: 14px;
    opacity: 0.92;
  }

  footer p {
    margin: 0;
    font-family: var(--font-mono);
    font-size: 0.8125rem;
    color: var(--gray);
    letter-spacing: 0.01em;
  }

  @media (max-width: 480px) {
    main { padding: 120px 0; }
  }
</style>
